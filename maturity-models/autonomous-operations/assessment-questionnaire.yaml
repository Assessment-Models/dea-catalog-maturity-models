  evaluation: dea:evaluation-autonomous-operations-v1
instructions:
- 'Scope first: define value streams/scenarios and select the weight profile (evaluation.yaml scoring.weight_profiles); record
  both in the result.'
- For each criterion, gather the listed evidence, have an independent assessor verify a sample, then score the achieved level
  (L0-L5) against the scale anchors.
- Gating criteria (4.1.1-4.1.4, if in scope) cap the org level via the weakest-link gate in evaluation.yaml.
- Record confidence per criterion (High/Medium/Low) per evaluation.yaml assessment.confidence_levels.
- 'Aggregate: criterion points -> dimension mean -> AO Autonomy Index -> band -> gate. Report index, level, stage, per-dimension
  profile, effort-adjusted value.'
