# assessment-questionnaire.yaml — generated from dimensions.yaml; one entry per criterion
# Level anchors reference scale.yaml; aggregation rules in evaluation.yaml.

id: dea:assessment-questionnaire-autonomous-operations-v1
version: 1.0.0-alpha
name: Autonomous Operations Assessment Questionnaire
model:
