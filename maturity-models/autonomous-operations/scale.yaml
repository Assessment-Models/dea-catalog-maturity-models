# scale.yaml — 5-level scale, canonical bands + AO stages (OODA closed loops, intent-driven)

id: dea:scale-autonomous-operations-v1
version: 1.0.0-alpha
metamodel_version: ^0.1.0
name: Autonomous Operations Maturity Scale
description: Five levels on the canonical org bands (index.yaml band-1..band-5), each with an ambitious AO stage and an OODA
  closed-loop progression driven by intent/goals.
status: draft
canonical_bands_ref: dea:catalog-maturity-models maturity-models/index.yaml bands
levels:
- id: level-1-ad-hoc
  canonical_band: band-1
  name: Ad Hoc
  score_range:
  - 0
  - 25
  ao_stage: Manual & Reactive
  summary: Everything is human-driven and reactive; no feedback loop exists.
  characteristics:
  - 'No closed loop: incidents, changes, and fulfillment are handled manually, often person-dependent'
  - Automation exists only as isolated scripts or one-off tools; no shared platform
  - Humans observe, orient, decide and act from dashboards and experience; no goal/intent model, no agents
  - Data is siloed; no unified telemetry; no data-driven feedback loop
  - No AO strategy, funding, or governance; value of automation is not measured
  exit_criteria:
  - At least one value stream has a documented, human-run process map
  - A named owner is accountable for AO exploration
  - Baseline telemetry (logs/metrics) exists for the in-scope services
  evidence:
  - Incidents detected by customer complaints or manual checks
  - Recovery time measured in days; changes deployed manually
  - No AO KPIs tracked
  progression:
    loop_driver: none — no feedback loop; humans react to events after they happen
    ooda:
      Observe: human
      Orient: human
      Decide: human
      Act: human
    scope: ad hoc, person-dependent
    human_role: humans perform every OODA stage
    loop_closure: open loop — no monitoring-to-action feedback
- id: level-2-defined
  canonical_band: band-2
  name: Defined
  score_range:
  - 26
  - 50
  ao_stage: Instrumented & Assisted
  summary: Telemetry and assistive tooling exist, but humans still decide and approve every action.
  characteristics:
  - Scripted/runbook automation covers repeatable tasks in some functions (CI/CD, ticket routing)
  - Observability stack deployed (logs, metrics, traces) for in-scope services; alerts are human-read
  - AI/ML assists humans (recommendations, classification) but humans decide and act
  - SLOs defined for top services; error budgets not yet enforced
  - AO strategy and initial funding exist; value tracked for one or more initiatives
  exit_criteria:
  - A closed loop (observe→decide→act) runs for at least one high-volume operational scenario
  - SLOs defined for all customer-facing services in scope
  - Guardrails (policy, approval gates) defined for automated actions
  evidence:
  - Deployment automation > 80% of services; incident runbooks exist
  - SLO dashboards published; post-mortems within 7 days for sev-1/sev-2
  - Automation coverage report per value stream
  progression:
    loop_driver: human-set goals; machines only monitor and recommend
    ooda:
      Observe: system-assisted
      Orient: human
      Decide: human
      Act: scripted
    scope: some functions / selected value streams
    human_role: humans orient, decide and approve; machines observe and execute predefined actions
    loop_closure: partial loop — detection automated, decision human, execution scripted
- id: level-3-managed
  canonical_band: band-3
  name: Managed
  score_range:
  - 51
  - 75
  ao_stage: Closed-Loop Automated
  summary: Closed loops run systematically across most operations and are measured against goals.
  characteristics:
  - A closed loop (observe→orient→decide→act) runs across most operational flows in scope
  - SLOs + error budgets enforced for all customer-facing services and influence release decisions
  - Systems decide within predefined rules for known cases; humans handle exceptions
  - Goal/intent management in place for in-scope domains (machine-readable goals via APIs)
  - Agent lifecycle management (versioning, monitoring, rollback, kill-switch) in place for deployed agents
  - Value realization tracked against a value-operations model; AO program governed with KPIs
  exit_criteria:
  - Auto-remediation covers > 30% of known incident classes
  - Predictive alerts > 50% of sev-1; recovery time < 30 min for sev-1
  - Every autonomous action is logged and auditable (guardrails + audit trail)
  - Simulation/digital-twin validation used before high-risk changes
  evidence:
  - Quarterly AO health report with per-dimension scores
  - Auto-remediation playbook library; guardrail policy catalogue
  - Audit-trail samples independently verifiable
  progression:
    loop_driver: human-set goals and SLOs drive the automated closed loop
    ooda:
      Observe: system
      Orient: system
      Decide: system-within-rules
      Act: system
    scope: most functions, whole organization for in-scope services
    human_role: humans set goals/SLOs and handle exceptions; the system senses, orients, decides within rules, and acts
    loop_closure: closed loop — continuous observe→orient→decide→act with human-set goals
- id: level-4-quantitatively-managed
  canonical_band: band-4
  name: Quantitatively Managed
  score_range:
  - 76
  - 90
  ao_stage: Goal-Driven Autonomy
  summary: Intent and goals drive closed loops that decide and act autonomously within guardrails; humans oversee and audit.
  characteristics:
  - Autonomous closed loops span end-to-end value streams, coordinating multiple autonomous agents/domains
  - Agents decide and execute for the majority of in-scope scenarios within policy guardrails; loop coordination resolves
    conflicts
  - Simulation/digital twin validates actions before production execution
  - 'Full auditability: every autonomous decision logged, explainable, and independently assessable'
  - 'Machine customers supported: agent-to-agent discovery, negotiation, fulfillment via APIs'
  - Effort-adjusted value reporting (diminishing returns made explicit) used for portfolio decisions
  exit_criteria:
  - Autonomous resolution > 60% of in-scope incidents without human intervention
  - Guardrail breach rate below defined threshold; 100% of autonomous actions auditable
  - Cross-domain orchestration proven across service, resource, and business loops
  evidence:
  - Agent action logs with decision provenance; guardrail breach dashboards
  - Digital-twin validation reports; machine-customer API catalogue
  - Independent assessor attestation of a sampled loop end-to-end
  progression:
    loop_driver: intent/goals drive the closed loop; the system owns Observe, Orient, Decide, Act within guardrails
    ooda:
      Observe: system
      Orient: system
      Decide: system
      Act: system
    scope: organization-wide for in-scope value streams
    human_role: humans set intent, goals, policy and guardrails; oversee and audit outcomes; handle escalations only
    loop_closure: closed autonomous loop — self-correcting within guardrails
- id: level-5-optimising
  canonical_band: band-5
  name: Optimising
  score_range:
  - 91
  - 100
  ao_stage: Self-Improving Ecosystem
  summary: Self-learning, goal-driven loops extend across the ecosystem and continuously improve on their own.
  characteristics:
  - Goal/intent is negotiated across the ecosystem; systems learn and adapt continuously (self-learning loops)
  - AO is a source of competitive advantage, benchmarked and shared externally
  - Ecosystem partners operate on shared autonomous loops (B2B2X, machine customers)
  - Sustainability (net-zero operations) is autonomously optimized, with carbon KPIs inside the loop
  - Continuous improvement is autonomous, not programme-driven; the model itself is governed and versioned
  exit_criteria:
  - None — continuous improvement is the practice; re-assessment cadence defined
  - Ecosystem-level value realization demonstrated with partners
  evidence:
  - External benchmarks and talks on AO practice
  - Ecosystem shared-loop metrics; self-learning model performance reports
  - Published AO governance and versioning record
  progression:
    loop_driver: intent/goals negotiated ecosystem-wide drive self-learning closed loops
    ooda:
      Observe: system
      Orient: system-learning
      Decide: system
      Act: system
    scope: organization + ecosystem partners
    human_role: humans govern, set ultimate goals/values, and audit; day-to-day operation is self-governing
    loop_closure: closed self-learning loop — self-correcting and self-improving, ecosystem-wide
scoring_metadata:
  level_points:
    L0-absent: 0
    L1: 20
    L2: 40
    L3: 60
    L4: 80
    L5: 100
  effort_multipliers:
    L1: 1.0
    L2: 1.5
    L3: 2.5
    L4: 4.0
    L5: 6.0
