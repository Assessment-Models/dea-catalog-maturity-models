    name: Autonomous Onboarding (Smart Things)
  - id: 3.1.5
    name: Autonomous Integration & Interoperability
  - id: 4.5.3
    name: Formulate and decide energy & carbon solution
levels:
- id: level-1-ad-hoc
  canonical_band: band-1
  name: Ad Hoc
  score_range:
  - 0
  - 25
  ao_stage: Manual & Reactive
  summary: Everything is human-driven and reactive; no feedback loop exists.
  characteristics:
  - 'No closed loop: incidents, changes, and fulfillment are handled manually, often person-dependent'
  - Automation exists only as isolated scripts or one-off tools; no shared platform
  - Humans observe, orient, decide and act from dashboards and experience; no goal/intent model, no agents
  - Data is siloed; no unified telemetry; no data-driven feedback loop
  - No AO strategy, funding, or governance; value of automation is not measured
  exit_criteria:
  - At least one value stream has a documented, human-run process map
  - A named owner is accountable for AO exploration
  - Baseline telemetry (logs/metrics) exists for the in-scope services
  evidence:
  - Incidents detected by customer complaints or manual checks
  - Recovery time measured in days; changes deployed manually
  - No AO KPIs tracked
  progression:
    loop_driver: none — no feedback loop; humans react to events after they happen
    ooda:
      Observe: human
      Orient: human
      Decide: human
      Act: human
    scope: ad hoc, person-dependent
    human_role: humans perform every OODA stage
    loop_closure: open loop — no monitoring-to-action feedback
- id: level-2-defined
  canonical_band: band-2
  name: Defined
  score_range:
  - 26
  - 50
  ao_stage: Instrumented & Assisted
  summary: Telemetry and assistive tooling exist, but humans still decide and approve every action.
  characteristics:
  - Scripted/runbook automation covers repeatable tasks in some functions (CI/CD, ticket routing)
  - Observability stack deployed (logs, metrics, traces) for in-scope services; alerts are human-read
  - AI/ML assists humans (recommendations, classification) but humans decide and act
  - SLOs defined for top services; error budgets not yet enforced
  - AO strategy and initial funding exist; value tracked for one or more initiatives
  exit_criteria:
  - A closed loop (observe→decide→act) runs for at least one high-volume operational scenario
  - SLOs defined for all customer-facing services in scope
  - Guardrails (policy, approval gates) defined for automated actions
  evidence:
  - Deployment automation > 80% of services; incident runbooks exist
  - SLO dashboards published; post-mortems within 7 days for sev-1/sev-2
  - Automation coverage report per value stream
  progression:
    loop_driver: human-set goals; machines only monitor and recommend
    ooda:
      Observe: system-assisted
      Orient: human
      Decide: human
      Act: scripted
    scope: some functions / selected value streams
    human_role: humans orient, decide and approve; machines observe and execute predefined actions
    loop_closure: partial loop — detection automated, decision human, execution scripted
- id: level-3-managed
  canonical_band: band-3
  name: Managed
  score_range:
  - 51
  - 75
  ao_stage: Closed-Loop Automated
  summary: Closed loops run systematically across most operations and are measured against goals.
  characteristics:
  - A closed loop (observe→orient→decide→act) runs across most operational flows in scope
  - SLOs + error budgets enforced for all customer-facing services and influence release decisions
  - Systems decide within predefined rules for known cases; humans handle exceptions
  - Goal/intent management in place for in-scope domains (machine-readable goals via APIs)
  - Agent lifecycle management (versioning, monitoring, rollback, kill-switch) in place for deployed agents
  - Value realization tracked against a value-operations model; AO program governed with KPIs
  exit_criteria:
  - Auto-remediation covers > 30% of known incident classes
  - Predictive alerts > 50% of sev-1; recovery time < 30 min for sev-1
  - Every autonomous action is logged and auditable (guardrails + audit trail)
  - Simulation/digital-twin validation used before high-risk changes
  evidence:
  - Quarterly AO health report with per-dimension scores
  - Auto-remediation playbook library; guardrail policy catalogue
  - Audit-trail samples independently verifiable
  progression:
    loop_driver: human-set goals and SLOs drive the automated closed loop
    ooda:
      Observe: system
      Orient: system
      Decide: system-within-rules
      Act: system
    scope: most functions, whole organization for in-scope services
    human_role: humans set goals/SLOs and handle exceptions; the system senses, orients, decides within rules, and acts
    loop_closure: closed loop — continuous observe→orient→decide→act with human-set goals
- id: level-4-quantitatively-managed
  canonical_band: band-4
  name: Quantitatively Managed
  score_range:
  - 76
  - 90
  ao_stage: Goal-Driven Autonomy
  summary: Intent and goals drive closed loops that decide and act autonomously within guardrails; humans oversee and audit.
  characteristics:
  - Autonomous closed loops span end-to-end value streams, coordinating multiple autonomous agents/domains
  - Agents decide and execute for the majority of in-scope scenarios within policy guardrails; loop coordination resolves
    conflicts
  - Simulation/digital twin validates actions before production execution
  - 'Full auditability: every autonomous decision logged, explainable, and independently assessable'
  - 'Machine customers supported: agent-to-agent discovery, negotiation, fulfillment via APIs'
  - Effort-adjusted value reporting (diminishing returns made explicit) used for portfolio decisions
  exit_criteria:
  - Autonomous resolution > 60% of in-scope incidents without human intervention
  - Guardrail breach rate below defined threshold; 100% of autonomous actions auditable
  - Cross-domain orchestration proven across service, resource, and business loops
  evidence:
  - Agent action logs with decision provenance; guardrail breach dashboards
  - Digital-twin validation reports; machine-customer API catalogue
  - Independent assessor attestation of a sampled loop end-to-end
  progression:
    loop_driver: intent/goals drive the closed loop; the system owns Observe, Orient, Decide, Act within guardrails
    ooda:
      Observe: system
      Orient: system
      Decide: system
      Act: system
    scope: organization-wide for in-scope value streams
    human_role: humans set intent, goals, policy and guardrails; oversee and audit outcomes; handle escalations only
    loop_closure: closed autonomous loop — self-correcting within guardrails
- id: level-5-optimising
  canonical_band: band-5
  name: Optimising
  score_range:
  - 91
  - 100
  ao_stage: Self-Improving Ecosystem
  summary: Self-learning, goal-driven loops extend across the ecosystem and continuously improve on their own.
  characteristics:
  - Goal/intent is negotiated across the ecosystem; systems learn and adapt continuously (self-learning loops)
  - AO is a source of competitive advantage, benchmarked and shared externally
  - Ecosystem partners operate on shared autonomous loops (B2B2X, machine customers)
  - Sustainability (net-zero operations) is autonomously optimized, with carbon KPIs inside the loop
  - Continuous improvement is autonomous, not programme-driven; the model itself is governed and versioned
  exit_criteria:
  - None — continuous improvement is the practice; re-assessment cadence defined
  - Ecosystem-level value realization demonstrated with partners
  evidence:
  - External benchmarks and talks on AO practice
  - Ecosystem shared-loop metrics; self-learning model performance reports
  - Published AO governance and versioning record
  progression:
    loop_driver: intent/goals negotiated ecosystem-wide drive self-learning closed loops
    ooda:
      Observe: system
      Orient: system-learning
      Decide: system
      Act: system
    scope: organization + ecosystem partners
    human_role: humans govern, set ultimate goals/values, and audit; day-to-day operation is self-governing
    loop_closure: closed self-learning loop — self-correcting and self-improving, ecosystem-wide
dimensions:
- id: '1'
  name: Party
  definition: The Party dimension evaluates the level of autonomy and associated business benefits in the engaging experience
    where parties view the organization as their digital partner using their preferred channels of interaction.
  sub_dimensions:
  - id: '1.1'
    name: Customer Engagement
    definition: The organization effectively orchestrates proactive, personalized, and context-aware interactions with customers
      as engaged parties, driving desired outcomes with minimal friction or effort required from the customer.
    criteria:
    - id: 1.1.1
      name: Predictive Engagement
      definition: The organization enables Predictive Engagement by using intelligent automation and customer insights (such
        as behavioral data and user profiles) to proactively anticipate customer needs and dynamically determine the right
        target, channel,…
    - id: 1.1.2
      name: Hyper-personalized Autonomous Offers
      definition: The organization delivers hyper-personalized products, services, bundles, and discounts by leveraging intelligent
        automation and real-time customer insights to dynamically tailor offers across channels.
    - id: 1.1.3
      name: Self-guided Autonomous Workflows
      definition: The organization enables self-customization through guided workflows that use customer preferences and lifestyle
        inputs to suggest personalized service, notification, and promotional settings via self-service platforms.
    - id: 1.1.4
      name: Zero-Effort Service
      definition: The organization ensures zero-effort usability across all customer-facing services, products, and digital
        interfaces, minimizing friction and enabling intuitive interaction.
    - id: 1.1.5
      name: Real-time Behavior-driven Expectation Management
      definition: The organization measures and drives customer delight by capturing behavioral and conversational signals
        during interactions to assess and exceed expectations in real time.
    - id: 1.1.6
      name: Autonomous Customer Interaction
      definition: The organization supports digital engagement through AI-driven autonomous channels, such as intelligent
        chat agents, that deliver consistent, responsive, and context-aware customer interactions.
    - id: 1.1.7
      name: Dynamic Customer Support
      definition: The organization prioritizes self-support with intelligent automation that provides resolution capabilities
        equal to or exceeding agent-assisted care.
    - id: 1.1.8
      name: Adaptive Loyalty Management
      definition: The organization personalizes loyalty rewards using intelligent automation and customer profile data to
        align incentives with individual preferences and behaviors.
  - id: '1.2'
    name: Customer Experience
    definition: The organization delivers consistent, high-quality, and effortless experiences to customers across all touchpoints
      through autonomous design, measurement, and optimization of end-to-end journeys.
    criteria:
    - id: 1.2.1
      name: Intelligent Experience Modelling
      definition: The organization uses intelligent automation to model customer experience quantitatively and qualitatively,
        incorporating contextual factors to predict and shape future interactions.
    - id: 1.2.2
      name: Autonomous Customer Experience Improvement
      definition: The organization continuously captures and monitors customer quality of experience (QoE) through automated
        measurement systems to inform real-time improvements in service delivery.
    - id: 1.2.3
      name: Party behavior Management
      definition: The organization tracks, analyzes, and acts on party (including customers, partners, AI agents, IoT) behavior
        and usage patterns, and self-initiated change using intelligent closed-loop automation for proactive engagement.
    - id: 1.2.4
      name: Seamless Party Onboarding Experience
      definition: The organization automates and simplifies party onboarding (from joining to enablement e.g. Activation)
        ensuring a seamless, fast, and error-free start to service.
    - id: 1.2.5
      name: Autonomous Cross-channel Context Management
      definition: Omnichannel engagement is enabled by intelligent channel context awareness with automated interaction handoff
        across engagement channels with alignment to Party intent.
    - id: 1.2.6
      name: Self-Optimizing Customer Journey
      definition: Customer journey is self-optimized in real time using automated analysis of user-level experience (QoE)
        data to improve satisfaction and conversion.
  - id: '1.3'
    name: Customer Insight
    definition: The organization generates actionable understanding of customer needs, behaviors, and intents by analyzing
      multi-source data throughout the customer journey, and applies these insights to drive closed-loop decision-making.
    criteria:
    - id: 1.3.1
      name: Automated Customer Portrait
      definition: The organization maintains advanced customer portraits that go beyond segmentation to include dynamic behavioral,
        contextual, and predictive attributes for operational use.
    - id: 1.3.2
      name: Active Customer value Scoring
      definition: The organization determines and applies customer value scores based on lifetime value, creditworthiness,
        and engagement, to guide decision-making in customer operations.
    - id: 1.3.3
      name: Customer Journey Actionable Insights
      definition: The organization extracts actionable insights from every customer journey touchpoint to enhance personalization,
        service quality, and operational responsiveness.
    - id: 1.3.4
      name: Real-time Single View
      definition: The organization provides a unified, real-time view of the customer (integrating account status, service
        health, device status, and order history) for seamless service delivery.
    - id: 1.3.5
      name: Automated Voice OF Customer
      definition: The organization automatically collects, analyzes, and operationalizes customer feedback, including complaints
        and sentiment, to improve services and resolve systemic issues.
    - id: 1.3.6
      name: Customer Intent Prediction
      definition: The organization captures and predicts customer intent to enable accurate Next Best Action decisions in
        real time across customer operations.
  - id: '1.4'
    name: Customer Trust
    definition: The organization establishes and sustains customer trust by ensuring the ethical, secure, reliable, and transparent
      operation of intelligent automation systems that deliver on promised outcomes.
    criteria:
    - id: 1.4.1
      name: Preemptive Intelligent Care
      definition: The organization delivers preemptive care by using intelligent automation to detect potential service disruptions
        and proactively notify or assist customers before issues arise.
    - id: 1.4.2
      name: Self-Governed SLAs
      definition: The organization meets and transparently communicates SLA commitments (such as speed, coverage, and response
        times) to customers through real-time self-monitoring, remediation and adaptive reporting.
    - id: 1.4.3
      name: Ethic Privacy Protection
      definition: The organization ensures ethical use and privacy protection of customer data through automated governance
        controls and continuous compliance monitoring.
  - id: '1.5'
    name: B2B2X Partner Engagement
    definition: The organization has the capability to engage and collaborate with parties as partners actively for value-creation
      within its ecosystem, and is enabling seamless co-delivery of customer-centric services through intelligent orchestration.
    criteria:
    - id: 1.5.1
      name: Automated B2B2X partner onboarding
      definition: The organization enables seamless onboarding of B2B2X partners through autonomous operations that automate
        provisioning, configuration, and integration.
    - id: 1.5.2
      name: Autonomous Partner Fulfillment
      definition: The organization delivers consistent, high-quality service experiences to B2B2X partners through automated
        fulfillment processes and real-time performance tracking.
    - id: 1.5.3
      name: Adaptive B2B2X Partner Support
      definition: The organization provides intent-based support to B2B2X partners using autonomous systems that anticipate
        needs and resolve issues without manual intervention.
    - id: 1.5.4
      name: B2B2X Partner Satisfaction
      definition: The organization measures and ensures B2B2X partner satisfaction by autonomously collecting feedback and
        verifying SLA compliance in real time.
    - id: 1.5.5
      name: B2B2X Shared Value
      definition: The organization generates and shares measurable value with B2B2X partners through autonomous insights and
        monetization capabilities such as revenue sharing and usage analytics.
    - id: 1.5.6
      name: Machine Customer & Agent-to-Agent Readiness
      definition: Products, APIs, and policies support machine customers (software agents that discover, negotiate, purchase,
        and operate services autonomously).
      added_in_revamp: true
      source: 'Gartner: machine customers could drive or influence $18T in purchases by 2030 (autonomous business).'
  - id: '1.6'
    name: Employee Engagement
    definition: The organization assesses the extent to which the organization empowers employees as key stakeholders through
      automation tools and systems that enhance their experience, agency, productivity, and contribution to shared outcomes.
    criteria:
    - id: 1.6.1
      name: Security Compliance
      definition: The organization enhances workplace safety and security compliance by automating hazardous tasks and enforcing
        data privacy and handling rules through autonomous monitoring.
    - id: 1.6.2
      name: Skills proficiency Enablement
      definition: The organization upskills employees through targeted training in data, automation, and system management,
        preparing them for higher-value roles in an AO-enabled environment.
    - id: 1.6.3
      name: Satisfying Engagement
      definition: The organization increases job satisfaction by using intelligent automation to eliminate repetitive tasks,
        enabling employees to focus on meaningful, fulfilling work.
    - id: 1.6.4
      name: Productive Efficiency Augmented Agency
      definition: The organization improves employee efficiency and productivity by automating routine tasks and measuring
        gains in resolution times, uptime, and task capacity.
    - id: 1.6.5
      name: Employee Self-Advancement
      definition: The organization supports role evolution and career growth by empowering self-adaption through autonomous
        role play.
    - id: 1.6.6
      name: Autonomous Systems Adoption
      definition: The organization ensures employees actively adopt and use intelligent automation tools in daily workflows,
        enabling data-driven decisions and increasing effectiveness through agent-augmented empowerment.
    - id: 1.6.7
      name: Employee Innovation Feedback Loops
      definition: The organization enables employees to contribute to innovation by identifying improvement opportunities
        through AO-enabled feedback loops, with structured measurement of idea generation and implementation impact.
    - id: 1.6.8
      name: Autonomous Collaboration
      definition: The organization enhances collaboration by integrating employee feedback into intelligent agents via automated
        communication platforms that capture intent and enable seamless coordination across teams and systems.
  - id: '1.7'
    name: Smart Things Engagement
    definition: The Smart Things Engagement sub-dimension assesses the extent to which smart and autonomous things (Agents)
      and Internet of things (IoT) are actively engaged as participating entities within the operational ecosystem, contributing
      to service delivery, efficiency, and innovation through autonomous i…
    criteria:
    - id: 1.7.1
      name: Autonomous Onboarding (Smart Things)
      definition: The organization enables autonomous onboarding of Things through machine-to-machine self-installation, self-configuration,
        and self-training, requiring no human intervention.
    - id: 1.7.2
      name: Self-Healing
      definition: The organization implements self-healing capabilities in Smart Things by using sensors to monitor equipment
        health, predict failures, and trigger corrective actions automatically to minimize downtime.
    - id: 1.7.3
      name: Dynamic adaptation
      definition: The organization achieves dynamic operational adaptation through intelligent agents that enable real-time,
        machine-to-machine adjustments to configurations and processes without human input.
    - id: 1.7.4
      name: Communication and learning
      definition: The organization enables autonomous communication and continuous learning between machines through intelligent
        agents that exchange insights and evolve behavior collaboratively over time.
    - id: 1.7.5
      name: Safety
      definition: The organization ensures safe interactions between machines, humans, and environments by enforcing real-time
        safety protocols through intelligent agents in both machine-to-machine and machine-to-human operations.
