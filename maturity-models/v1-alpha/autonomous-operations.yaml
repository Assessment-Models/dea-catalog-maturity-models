# Autonomous Operations Maturity Model — dea:maturity-autonomous-operations
# Catalog registration (v1-alpha schema). Self-contained repo-ready asset bundle: maturity-models/autonomous-operations/
# Levels: canonical org bands + AO stages on OODA closed loops driven by intent/goals. See proposals/0002.

id: dea:maturity-autonomous-operations
name: Autonomous Operations Maturity Model
domain: autonomous-operations
version: 1.0.0-alpha
metamodel_version: ^0.1.0
description: Autonomous Operations (AO) maturity and assessment model — the enterprise operating model in which value streams
  are instrumented with AI, data and closed-loop control so that agents and autonomous systems learn, self-govern and self-adapt,
  with intent/goals driving the closed loops (Observe-Orient-Decide-Act) and the decision/execution burden shifting progressively
  from humans to machines. Harvested and cleaned from an industry AO maturity workbook v1.8.0, gap-filled against 2025-26
  industry sources (see proposals/0002).
owner: Assessment Models — Autonomous Operations working group
provenance:
  harvested_from: Industry Autonomous Operations maturity workbook, v1.8.0 (XLSX, 12 sheets)
  source_md5: 61ce82cba20cd8c87ce4e079b8a2e966
  source_counts: 6 dimensions / 32 sub-dimensions / 151 criteria x 5 levels
  this_model_counts: 6 dimensions / 32 sub-dimensions / 157 criteria
  gap_analysis: proposals/0002-autonomous-operations-maturity-model.md
  asset_bundle: maturity-models/autonomous-operations/ (repo-ready package for a dedicated maturity-model-autonomous-operations
    repository)
  cleaning_applied:
  - IDs normalized to text (6 float-formatted IDs fixed)
  - criterion 6.2.5 reassigned to sub-dimension 6.3 as 6.3.5 (source prefix mismatch)
  - 2 cross-dimension duplicate criterion names merged (3.4.2→4.6.1, 3.4.3→4.6.2); 4.5.3, 1.7.1, 3.1.5 renamed for scope clarity
    and vocabulary hygiene
  - 8 gap criteria added from 2025-26 industry sources (marked added_in_revamp)
  - one explicit OODA/closed-loop progression ladder replaces 755 ad-hoc level-text cells
  dropped_duplicates:
  - id: 3.4.2
    name: Catalog Driven Service Realization
    reason: merged into 4.6.1
  - id: 3.4.3
    name: Intelligent Productization
    reason: merged into 4.6.2
