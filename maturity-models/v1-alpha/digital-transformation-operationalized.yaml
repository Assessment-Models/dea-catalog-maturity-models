    criteria:
    - id: d4c4
      name: Autonomy level per domain (AN L0-L5)
      statement: 'Each operational domain is assessed against the AN ladder: who owns awareness, analysis, decision, execution,
        intent.'
      levers:
      - autonomy
      - agentic-ai
      anchors:
      - level: 1
        text: 'L0/L1: manual, reactive operations'
      - level: 2
        text: 'L2: rule-based automation in some domains'
      - level: 3
        text: 'L3: conditional automation + AI monitoring in key domains'
      - level: 4
        text: 'L4: closed-loop, intent-driven autonomy in selected domains; system owns awareness-to-execution, intent shared
          with humans'
      - level: 5
        text: 'L5: system sets its own intents within policy across scenarios; cognitive self-adaptation'
      evidence:
      - Ops runbooks
      - Automation coverage
      - AIOps deployment; AN level assessment per domain
      - Closed-loop change logs; TMF AN validation/certification
      - Intent ownership matrix; autonomous change records
    - id: d4c5
      name: Zero-touch operations & self-healing
      statement: 'Routine operations are zero-touch: detect, decide, and remediate automatically.'
      levers:
      - autonomy
      anchors:
      - level: 1
        text: All operations manual
      - level: 2
        text: Scripts for known issues; human executes
      - level: 3
        text: Auto-remediation for known failure modes in key domains
      - level: 4
        text: Self-healing/self-optimizing across most domains; MTTD/MTTR low
      - level: 5
        text: Fully zero-touch routine ops; predictive prevention before customer impact
      evidence:
      - Runbooks
      - Script inventory
      - Auto-remediation %; incident logs
      - Self-healing metrics
      - Prevented-incident count; customer-impact minutes
    - id: d4c6
      name: Agentic operations & human-on-the-loop
      statement: AI agents run operational workflows (NOC/SOC/service) with defined agency, human-on-the-loop oversight,
        escalation, and kill-switch.
      levers:
      - agentic-ai
      - human-agent-teaming
      - autonomy
      anchors:
      - level: 1
        text: No agents in operations
      - level: 2
        text: Agent assistants suggest; humans execute
      - level: 3
        text: Agents execute defined runbooks under HITL supervision
      - level: 4
        text: Agents act autonomously in bounded scopes with logging, rollback, and human-on-the-loop
      - level: 5
        text: Agent swarms handle incidents end to end within policy; humans set intent and policy only
      evidence:
      - Agent use cases
      - HITL logs
      - Runbook automation coverage
      - Agent action logs with rollback; kill-switch tests
      - Autonomous incident resolution rate; safety record
  - id: d4s3
    name: Digital Twins & Simulation
    lite_question: We run living digital twins of network, services, and the organization to simulate before we act.
    criteria:
    - id: d4c7
      name: Network & service digital twins
      statement: Digital twins of network domains and services provide real-time state, prediction, and what-if simulation.
      levers:
      - digital-twins
      - autonomy
      anchors:
      - level: 1
        text: No twins; static inventory only
      - level: 2
        text: Partial models of some domains; not real-time
      - level: 3
        text: Real-time twins for key domains feeding assurance and planning
      - level: 4
        text: Cross-domain twins with predictive simulation (capacity, faults, changes)
      - level: 5
        text: 'Closed-loop: twin drives autonomous action and verifies outcome in the live system'
      evidence:
      - Inventory/CMDB
      - Domain models
      - Twin dashboards; prediction accuracy
      - What-if simulation records
      - Closed-loop change verification
    - id: d4c8
      name: Digital Twin of the Organization (DTO) & process mining
      statement: A DTO, fed by process mining and operational data, models how the business actually runs to plan, simulate,
        and optimize initiatives.
      levers:
      - digital-twins
      - data-intelligence
      anchors:
      - level: 1
        text: No process mining; processes tribal knowledge
      - level: 2
        text: Process mining in one function; DTO concept known
      - level: 3
        text: DTO live for top value streams; used to plan initiatives
      - level: 4
        text: Enterprise DTO with simulation of strategy/operating-model changes
      - level: 5
        text: 'DTO as the operating sandbox: changes simulated, agents rehearse, then executed; benchmarks published'
      evidence:
      - Event logs
      - Process models
      - DTO coverage of value streams
      - Simulation study reports
      - DTO-driven decisions; agent sandbox usage
    - id: d4c9
      name: Simulation-driven planning
      statement: Major decisions (capacity, launches, org/operating-model changes) are simulated in twins before commitment.
      levers:
      - digital-twins
      - business-value
      anchors:
      - level: 1
        text: Decisions by gut feel; no simulation
      - level: 2
        text: Spreadsheets for some plans
      - level: 3
        text: What-if analysis for major initiatives in twins
      - level: 4
        text: 'Standard practice: simulate-then-execute for strategy and ops changes'
      - level: 5
        text: 'Continuous simulation: twins recommend optimal actions; autonomous execution within policy'
      evidence:
      - Planning decks
      - Model-based business cases
      - Simulation records attached to decisions
      - Decision log with simulated vs actual
      - Autonomous optimization actions
  - id: d4s4
    name: Resilience, Performance & Sustainable Ops
    lite_question: Operations are resilient, tested, and managed for performance, cost, and carbon.
    criteria:
    - id: d4c10
      name: Incident response & resilience testing
      statement: Incident response is rehearsed and resilience is tested (chaos engineering, game days, TLPT-style tests).
      levers:
      - autonomy
      - grc
      anchors:
      - level: 1
        text: No IR process; recovery in days
      - level: 2
        text: Runbook exists; postmortems ad hoc
      - level: 3
        text: Incident command; SLOs; postmortems within 7 days; chaos experiments
      - level: 4
        text: Predictive detection; auto-remediation over 30% of incidents; regular TLPT/DR tests
      - level: 5
        text: Resilience proven continuously; self-healing prevents most incidents; regulatory tests passed
      evidence:
      - IR runbooks; MTTR trends
      - Postmortem records
      - Chaos/game-day reports
      - TLPT/DR test results
      - Incident prevention metrics; regulator reports
    - id: d4c11
      name: Performance & flow management
      statement: 'Operational performance is managed with flow metrics (DORA: deployment frequency, lead time, change failure
        rate, MTTR) and cost per workload (FinOps).'
      levers:
      - business-value
      - innovation
      anchors:
      - level: 1
        text: No flow/cost metrics
      - level: 2
        text: Deploy frequency tracked manually
      - level: 3
        text: DORA metrics tracked; cost per workload weekly
      - level: 4
        text: Metrics drive release and capacity decisions; FinOps automated
      - level: 5
        text: 'Self-optimizing flow: AI balances speed, reliability, and cost continuously'
      evidence:
      - Dashboards
      - Manual reports
      - DORA dashboard; FinOps reports
      - Error-budget-driven releases
      - Optimization actions; cost/reliability trends
    - id: d4c12
      name: Carbon-aware operations (GreenOps)
      statement: 'Operations minimize energy/carbon: efficient infra, carbon-aware scheduling, renewable-powered facilities.'
      levers:
      - sustainability-esg
      anchors:
      - level: 1
        text: No energy monitoring in ops
      - level: 2
        text: Basic DC energy metrics
      - level: 3
        text: Energy per workload tracked; efficiency targets in ops KPIs
      - level: 4
        text: Carbon-aware workload placement/scheduling automated
      - level: 5
        text: Net-zero operations; AI continuously minimizes emissions; industry leadership
      evidence:
      - DC energy reports
      - Efficiency SOPs
      - Energy-per-workload dashboards
      - Carbon-aware scheduler logs
      - Emissions reductions; green certifications
- id: d5
  name: People, Culture & Human-Agent Teaming
  weight: 0.1
  description: Leadership and culture for digital business, the digital workforce (skills, DEI, inclusion, EX), the designed
    working model between humans and AI agents, and innovation ways of working.
  sub_dimensions:
  - id: d5s1
    name: Leadership, Culture & Operating Model
    lite_question: Leaders sponsor digital business and the operating model is designed for it.
    criteria:
    - id: d5c1
      name: Executive sponsorship & digital values
      statement: Executives sponsor transformation, model digital values, and are held accountable for outcomes.
      levers:
      - innovation
      anchors:
      - level: 1
        text: No exec sponsor; transformation informal
      - level: 2
        text: Champion exists; leadership passive
      - level: 3
        text: Exec sponsor; digital values in leadership principles; board KPIs
      - level: 4
        text: Leaders visibly lead; values drive decisions; accountability in incentives
      - level: 5
        text: Culture self-reinforcing; leaders benchmark-set; transformation is how the org works
      evidence:
      - Charters; comms
      - Pulse surveys
      - Board KPI pack
      - 360 reviews; incentive schemes
      - Engagement scores; external recognition
    - id: d5c2
      name: Target operating model & org design
      statement: The target operating model (teams, decision rights, platforms, governance) is explicitly designed and evolved.
      levers:
      - innovation
      anchors:
      - level: 1
        text: Org by function/silo; no TOM
      - level: 2
        text: TOM documented; adoption partial
      - level: 3
        text: TOM implemented for value streams; decision rights clear
      - level: 4
        text: Operating model measured and tuned with data (flow, outcomes)
      - level: 5
        text: 'Self-adapting org design: structure and roles evolve with strategy automatically'
      evidence:
      - Org charts
      - TOM doc
      - Value-stream team maps
      - Flow/outcome metrics per team
      - Org change log driven by data
    - id: d5c3
      name: Change management & adoption
      statement: 'Change is managed professionally: communication, training, adoption metrics, and feedback loops.'
      levers:
      - innovation
      anchors:
      - level: 1
        text: Changes imposed; adoption poor
      - level: 2
        text: Comms plans exist; no adoption tracking
      - level: 3
        text: Structured change management with adoption metrics per initiative
      - level: 4
        text: Adoption predicted and managed proactively; resistance addressed early
      - level: 5
        text: 'Change is normal: high adoption by default; org learns continuously'
      evidence:
      - Change plans
      - Comms analytics
      - Adoption dashboards
      - Predictive adoption models
      - Learning loop records
  - id: d5s2
    name: Talent, Skills & Inclusive Workforce
    lite_question: We build digital and AI-fluent talent and an inclusive, accessible workplace.
    criteria:
    - id: d5c4
      name: Digital & AI skills, reskilling, careers
      statement: 'Workforce digital/AI fluency is systematically built: reskilling, career paths, talent marketplace/gig
        options.'
      levers:
      - innovation
      - agentic-ai
      anchors:
      - level: 1
        text: No training programs; skills ad hoc
      - level: 2
        text: Ad hoc courses; no career paths for digital roles
      - level: 3
        text: Skills ontology + reskilling programs; digital career paths defined
      - level: 4
        text: Continuous learning embedded; AI fluency expected of leaders; talent marketplace active
      - level: 5
        text: Workforce self-upskilling with AI tutors; gig/talent marketplace liquid; skills supply exceeds demand
      evidence:
      - Training catalog
      - Skills assessments
      - Learning platform analytics
      - Career path docs; marketplace usage
      - Skills supply/demand metrics; retention
    - id: d5c5
      name: DEI, accessibility & digital inclusion
      statement: Diversity, equity, inclusion, accessibility (WCAG), and digital inclusion are designed into products, services,
        and the workplace.
      levers:
      - innovation
      anchors:
      - level: 1
        text: No DEI or accessibility program
      - level: 2
        text: Awareness; some accommodations
      - level: 3
        text: DEI program with metrics; WCAG conformance for customer-facing digital; inclusive hiring
      - level: 4
        text: DEI and accessibility KPIs in product/HR reviews; bias audited in AI
      - level: 5
        text: Inclusion by design; industry-leading accessibility and DEI; shapes standards
      evidence:
      - DEI policy
      - Accommodation records
      - DEI metrics; WCAG audit reports
      - AI bias audit results
      - Certifications; awards; benchmarks
    - id: d5c6
      name: Employee experience & hybrid work
      statement: Employee experience, collaboration tooling, and hybrid-work models are deliberately designed and measured.
      levers:
      - innovation
      anchors:
      - level: 1
        text: No EX focus; tools fragmented
      - level: 2
        text: Basic collaboration tools; EX surveyed annually
      - level: 3
        text: Digital workplace platform; EX measured continuously; hybrid model defined
      - level: 4
        text: EX drives decisions; AI-assisted productivity; wellbeing monitored
      - level: 5
        text: 'Self-optimizing workplace: EX, productivity, wellbeing continuously optimized'
      evidence:
      - EX survey tooling
      - Hybrid policy
      - EX dashboards
      - Wellbeing metrics; tooling analytics
      - EX-driven changes; productivity trends
  - id: d5s3
    name: Human-Agent Teaming & Oversight
    lite_question: Humans and AI agents work as a designed team with clear roles, trust, and oversight.
    criteria:
    - id: d5c7
      name: Delegation & task-allocation protocols
      statement: 'Who delegates what to agents is explicit: task types, autonomy ceilings, and escalation paths are defined.'
      levers:
      - human-agent-teaming
      - agentic-ai
      anchors:
      - level: 1
        text: No guidance; agents used ad hoc
      - level: 2
        text: Informal norms; humans approve everything
      - level: 3
        text: Delegation matrix per domain; agency levels per task risk
      - level: 4
        text: 'Dynamic delegation: autonomy granted by demonstrated agent performance'
      - level: 5
        text: 'Trusted autonomy: agents and humans divide work optimally by design'
      evidence:
      - Agent usage logs
      - HITL records
      - Delegation policy; agency-level matrix
      - Performance-based autonomy grants
      - Optimal task-split analytics
    - id: d5c8
      name: Trust calibration & shared mental models
      statement: People understand agent capabilities/limits (shared mental models); trust is calibrated, not assumed.
      levers:
      - human-agent-teaming
      anchors:
      - level: 1
        text: Blind trust or blind distrust
      - level: 2
        text: Basic training on AI limits
      - level: 3
        text: Training + explainability for agent decisions; trust metrics monitored
      - level: 4
        text: 'Calibrated trust: oversight matches verified reliability; explanations on demand'
      - level: 5
        text: 'Well-calibrated symbiosis: humans and agents anticipate each other; team performance exceeds either alone'
      evidence:
      - Training records
      - Trust surveys
      - Explainability tooling usage
      - Trust-vs-reliability analysis
      - Team performance metrics
    - id: d5c9
      name: Human-in/on-the-loop oversight & safety
      statement: 'Oversight matches autonomy level: human-in-the-loop for high-impact actions; kill-switch, rollback, and
        incident escalation always available.'
      levers:
      - human-agent-teaming
      - trust-security-privacy
      anchors:
      - level: 1
        text: No oversight; agents (if any) unsupervised
      - level: 2
        text: Human approves all agent actions
      - level: 3
        text: HITL for high-impact actions; kill-switch and rollback exist and are tested
      - level: 4
        text: Human-on-the-loop for bounded autonomy; continuous monitoring with automated escalation
      - level: 5
        text: 'Safety engineered in: guardrails + guardian agents; human oversight of the oversight; zero-harm record'
      evidence:
      - Oversight policy
      - Approval logs
      - Kill-switch test records
      - Monitoring/escalation logs
      - Safety audit; incident reviews
    - id: d5c10
      name: Agent accountability & identity
      statement: Agents have identities, owners, and audit trails; accountability for agent actions is unambiguous (RACI
        incl. agents).
      levers:
      - human-agent-teaming
      - grc
      anchors:
      - level: 1
        text: Agents anonymous; no owner
      - level: 2
        text: Agent inventory started; owners assigned
      - level: 3
        text: Agent identity + owner + audit log per action; RACI includes agents
      - level: 4
        text: 'Automated accountability: every agent action attributable, explainable, reversible'
      - level: 5
        text: Agent governance self-improving; audit-ready; contributes standards back
      evidence:
      - Agent registry
      - Owner assignments
      - Audit logs per action
      - Attribution reports
      - Audit opinions; standard contributions
  - id: d5s4
    name: Ways of Working & Innovation
    lite_question: We work in product-centric agile ways and innovate safely at scale.
    criteria:
    - id: d5c11
      name: Product-centric agile at scale
      statement: Product-centric, cross-functional teams deliver via value streams with flow metrics; agile-at-scale frameworks
        as needed.
      levers:
      - innovation
      anchors:
      - level: 1
        text: Waterfall projects; handoffs between silos
      - level: 2
        text: Some agile teams; rest waterfall
      - level: 3
        text: Product teams own outcomes; value streams mapped; flow metrics used
      - level: 4
        text: Agile at scale operating; flow optimized; dependencies managed
      - level: 5
        text: Self-organizing value networks; flow self-optimizing; elite DORA metrics
      evidence:
      - Team topologies
      - Agile ceremonies
      - Value-stream maps; DORA metrics
      - Flow efficiency reports
      - Optimization actions; trends
    - id: d5c12
      name: Experimentation & safe-to-fail
      statement: 'Experimentation is the norm: hypotheses, A/B tests, blameless learning, safe-to-fail culture.'
      levers:
      - innovation
      anchors:
      - level: 1
        text: Failure punished; no experiments
      - level: 2
        text: Experiments occasional; blame culture
      - level: 3
        text: Experiment platform; A/B standard; blameless postmortems
      - level: 4
        text: High experiment velocity; learning systematized
      - level: 5
        text: 'Innovation engine: continuous experiments self-optimize products and processes'
      evidence:
      - Postmortem culture records
      - Experiment logs
      - Experiment platform metrics
      - Learning repository
      - Innovation ROI; experiment velocity
    - id: d5c13
      name: Venturing, open source & standards participation
      statement: 'The org engages beyond its walls: corporate venturing, open-source strategy, and participation in standards
        bodies (TM Forum, GSMA/CAMARA, 3GPP, IETF).'
      levers:
      - innovation
      - ecosystem-platforms
      anchors:
      - level: 1
        text: No external engagement
      - level: 2
        text: Ad hoc contributions
      - level: 3
        text: Open-source strategy; contributions to key projects; standards participation
      - level: 4
        text: Strategic standards/OSS investments shaping industry direction; venturing arm active
      - level: 5
        text: 'Ecosystem leadership: standards authored, OSS projects led, ventures scaled'
      evidence:
      - OSS policy
      - Contribution logs
      - Standards body roles
      - Patent/position papers; venture portfolio
      - Industry leadership evidence
- id: d6
  name: Data & the Intelligent Enterprise
  weight: 0.15
  description: 'Data as the foundation of the digital business: modern architecture and data products, governance/trust/sharing,
    AI- and agent-ready data, and decision intelligence that closes the loop into action.'
  sub_dimensions:
  - id: d6s1
    name: Data Foundation & Architecture
    lite_question: Our data platform is modern, real-time, and product-oriented.
    criteria:
    - id: d6c1
      name: Modern data architecture & data products
      statement: Data architecture (lakehouse/mesh/fabric) is modern, and data is managed as products with contracts, owners,
        and SLAs.
      levers:
      - data-intelligence
      - composability
      anchors:
      - level: 1
        text: Siloed databases; no architecture
      - level: 2
        text: Central warehouse; no ownership
      - level: 3
        text: Lakehouse/fabric with domain ownership; first data products with contracts/SLAs
      - level: 4
        text: 'Data mesh operating: self-serve infrastructure, data products at scale, federated governance'
      - level: 5
        text: 'Autonomous data platform: products self-register, quality self-heals, marketplace thriving'
      evidence:
      - Data inventory
      - Warehouse reports
      - Data product catalog + contracts
      - Mesh metrics; product SLAs
      - Marketplace usage; automated quality
    - id: d6c2
      name: Real-time & streaming data
      statement: Critical data is available in real time via streaming/event-driven pipelines.
      levers:
      - data-intelligence
      anchors:
      - level: 1
        text: Batch-only; days-old data
      - level: 2
        text: Some real-time feeds for key systems
      - level: 3
        text: Streaming platform (Kafka-class) for critical events; freshness SLAs
      - level: 4
        text: Event-driven architecture enterprise-wide; real-time by default
      - level: 5
        text: Real-time fabric powers agents, twins, and decisions autonomously
      evidence:
      - ETL batch jobs
      - Streaming topics inventory
      - Freshness SLA dashboards
      - Event-driven service count
      - Real-time use cases (agents, twins)
    - id: d6c3
      name: Data quality & observability
      statement: 'Data quality is automated and observable: quality SLAs, anomaly detection, lineage, incident response
        for data.'
      levers:
      - data-intelligence
      - trust-security-privacy
      anchors:
      - level: 1
        text: No quality checks; issues found by users
      - level: 2
        text: Manual checks on some datasets
      - level: 3
        text: Automated quality tests on critical data products; lineage captured; data SLOs
      - level: 4
        text: AI-driven anomaly detection; automated remediation; data observability platform
      - level: 5
        text: 'Self-healing data: quality issues prevented/detected/fixed automatically; trust metrics published'
      evidence:
      - Quality reports
      - Data SLAs
      - Observability dashboards
      - Anomaly/alert logs
      - Data incident MTTR; trust scores
  - id: d6s2
    name: Data Governance, Trust & Sharing
    lite_question: Data is governed, trusted, protected, and shared - internally and with the ecosystem.
    criteria:
    - id: d6c4
      name: Data governance, catalog & lineage
      statement: Data governance with catalog, lineage, policies, and stewardship is systematic.
      levers:
      - grc
      - data-intelligence
      anchors:
      - level: 1
        text: No governance; tribal knowledge
      - level: 2
        text: Policy doc; no catalog
      - level: 3
        text: Central catalog with owners/stewards; lineage; policies enforced
      - level: 4
        text: Federated governance automated; policy-as-code; compliance evidenced
      - level: 5
        text: 'Self-governing data: policies self-enforce and self-audit; benchmarks set'
      evidence:
      - Governance policy
      - Stewardship roster
      - Catalog + lineage coverage
      - Policy-as-code logs
      - Audit reports
    - id: d6c5
      name: Data protection, privacy & sovereignty
      statement: Data is protected (encryption, access control, DLP), privacy-compliant, and sovereignty-respecting.
      levers:
      - trust-security-privacy
      - grc
      anchors:
      - level: 1
        text: No access controls beyond basic; no DLP
      - level: 2
        text: RBAC in place; encryption partial; no residency controls
      - level: 3
        text: Encryption at rest/in transit; DLP; consent-aware access; residency per jurisdiction
      - level: 4
        text: Automated classification + protection; PETs for sensitive analytics; sovereignty audits
      - level: 5
        text: Zero-trust data fabric; privacy-preserving analytics by default; audit-ready sovereignty
      evidence:
      - Access reviews
      - Encryption standards
      - DLP reports; classification coverage
      - PET usage; sovereignty audit results
      - Zero-trust data access logs
    - id: d6c6
      name: Open & collaborative data ecosystems
      statement: Data is shared securely with partners/ecosystem (data spaces, contracts, marketplaces) and open data where
        appropriate.
      levers:
      - ecosystem-platforms
      - data-intelligence
      anchors:
      - level: 1
        text: No external data sharing
      - level: 2
        text: Ad hoc extracts for partners
      - level: 3
        text: Governed data-sharing agreements; data exchange platform
      - level: 4
        text: Data marketplace/ecosystem live; API-based data products monetized
      - level: 5
        text: 'Trusted data ecosystem at scale: federated sharing, consent-managed, value measured'
      evidence:
      - Sharing agreements
      - Extract logs
      - Data exchange platform
      - Marketplace transactions
      - Ecosystem data value reports
  - id: d6s3
    name: AI- & Agent-Ready Data
    lite_question: 'Data is ready for AI agents and twins: accessible, well-described, and tool-exposed.'
    criteria:
    - id: d6c7
      name: Agent-accessible data & tool interfaces
      statement: Agents can safely discover and use data/tools via governed interfaces (e.g., MCP-class), with permissions
        and logging.
      levers:
      - agentic-ai
      - data-intelligence
      anchors:
      - level: 1
        text: Agents have no data access or use scraping
      - level: 2
        text: Manual extracts for AI projects
      - level: 3
        text: Curated datasets for AI; access-controlled tool APIs
      - level: 4
        text: 'Governed agent data fabric: semantic layer + tool registry; per-agent permissions; usage logged'
      - level: 5
        text: Agents self-serve governed data/tools; autonomous discovery within policy; audit complete
      evidence:
      - AI project data requests
      - Dataset catalog
      - Tool/API registry
      - Agent permission policies + access logs
      - Discovery analytics; audit reports
    - id: d6c8
      name: RAG, vector, feature & synthetic data
      statement: LLM/agent data stack (vector stores, feature stores, RAG pipelines, synthetic data) is managed and governed.
      levers:
      - agentic-ai
      - data-intelligence
      anchors:
      - level: 1
        text: No vector/feature infra; prompts use raw docs
      - level: 2
        text: Ad hoc vector DB; no governance
      - level: 3
        text: Managed vector/feature stores; RAG pipelines with evals; synthetic data for privacy
      - level: 4
        text: Feature/vector platforms as a service; RAG quality monitored; synthetic data certified
      - level: 5
        text: 'AI data platform self-optimizing: retrieval quality, freshness, and privacy automated'
      evidence:
      - RAG prototype
      - Vector DB inventory
      - Feature store catalog
      - RAG eval dashboards; synthetic data certs
      - Automated retrieval quality; privacy proofs
    - id: d6c9
      name: Twin & simulation data pipelines
      statement: Twins/simulations are fed by governed, high-fidelity data pipelines (telemetry, events, context).
      levers:
      - digital-twins
      - data-intelligence
      anchors:
      - level: 1
        text: No twin data pipelines
      - level: 2
        text: Manual data pulls for models
      - level: 3
        text: Automated pipelines feeding domain twins; data contracts with twin teams
      - level: 4
        text: Enterprise twin data fabric; freshness/quality SLAs for simulation data
      - level: 5
        text: Twins self-fed and self-validating; simulation data audit-ready
      evidence:
      - Model input logs
      - Pipeline configs
      - Data contracts with twin teams
      - Twin data SLA dashboards
      - Simulation validation reports
  - id: d6s4
    name: Decision Intelligence
    lite_question: Insights become decisions and actions automatically.
    criteria:
    - id: d6c10
      name: Self-service & augmented analytics
      statement: Business users self-serve governed data with augmented analytics (AutoML, NLQ).
      levers:
      - data-intelligence
      anchors:
      - level: 1
        text: Analyst bottleneck; static reports
      - level: 2
        text: BI tool for analysts; some self-service
      - level: 3
        text: Self-service analytics widely adopted; data products consumed via NLQ
      - level: 4
        text: 'Augmented analytics: AutoML, NLQ, auto-insights for all teams'
      - level: 5
        text: 'Analytics self-serve and proactive: insights delivered before asked'
      evidence:
      - BI usage reports
      - Self-service adoption metrics
      - NLQ/AutoML usage
      - Auto-insight delivery logs
      - Insight-to-action time
    - id: d6c11
      name: Autonomous insights & decision loops
      statement: 'Insights drive decisions automatically: closed loops from detection to action (ops, pricing, CX).'
      levers:
      - agentic-ai
      - data-intelligence
      - autonomy
      anchors:
      - level: 1
        text: Insights in slide decks; decisions manual
      - level: 2
        text: Dashboards reviewed weekly
      - level: 3
        text: Automated alerts with recommended actions; some auto-executed
      - level: 4
        text: Closed-loop decision systems in key domains (dynamic pricing, assurance) with guardrails
      - level: 5
        text: 'Autonomous decision fabric: insights-to-decisions-to-actions-to-learning, human-on-the-loop'
      evidence:
      - Alert fatigue reports
      - Review cadence
      - Action logs; guardrail configs
      - Closed-loop success metrics
      - Decision latency; human override logs
    - id: d6c12
      name: Insight-to-action accountability
      statement: Every automated insight/decision is attributable, explainable, and auditable; outcomes measured.
      levers:
      - data-intelligence
      - grc
      anchors:
      - level: 1
        text: No tracking of insight outcomes
      - level: 2
        text: Some decisions logged
      - level: 3
        text: Decision logs with rationale; outcomes tracked for key loops
      - level: 4
        text: 'Full audit trail: data-to-model-to-decision-to-action-to-outcome; explainability on demand'
      - level: 5
        text: 'Self-auditing intelligence: drift, bias, and value monitored continuously; regulator-ready'
      evidence:
      - Decision logs
      - Outcome reports
      - Audit trail coverage
      - Explainability reports
      - Continuous audit; value-of-insights metrics
assessment:
  modes:
  - 'lite-self-assessment: 24 sub-dimension Likert questions, indicative score, no evidence required'
  - 'full-assessment: all 72 criteria scored 1-5 with evidence artifacts, conducted or verified by an independent assessor'
  assessor_rules:
  - Independent assessor preferred; self-assessment results are labeled as such (self-scoring inflates ~1 level on hard-to-evidence
    areas).
  - 'Repeatability per ISO/IEC 33002: a second assessor must reach the same rating from the same artifacts; calibration
    sessions with exemplars are required.'
  - Every criterion score must cite at least one evidence artifact from the criterion's evidence list.
  - 'MECE integrity: each criterion is assessed only in its home sub-dimension; cross-cutting impact is expressed via levers,
    not duplicate scoring.'
  evidence_principle: 'Level descriptors are written to be observable by an independent assessor: artifacts, metrics, logs,
    configurations, and governance records.'
definitions:
- concept: Digital transformation / digital business
  definition: Exploiting digital technologies and supporting capabilities to create a robust new digital business model;
    digitalization = using digital technologies to change a business model and create new revenue/value opportunities (the
    move to a digital business); digital business = new business designs blurring the digital and physical worlds.
  source: Gartner IT Glossary (digital business transformation, digitalization, digital business); WEF Digital Transformation
    reports (transformation is a business-model reimagining, not an IT initiative; digital enterprises run leaner operating
    models with customers and employees at the center)
- concept: Agentic AI / AI agents
  definition: Autonomous or semi-autonomous software entities that use AI to perceive, make decisions, take actions and
    achieve goals in digital/physical environments; agentic AI systems act autonomously with minimal human supervision,
    adapt to context and execute goals, orchestrating one or more agents toward strategic objectives. Governance requires
    graded levels of agency, guardrails, orchestration and runtime oversight.
  source: 'Gartner Top Strategic Technology Trends 2025: Agentic AI; Gartner AI agent definitions (2025-2026)'
- concept: Autonomous AI systems / autonomy ladder
  definition: 'TM Forum Autonomous Networks L0-L5: per domain, which party owns awareness, analysis, decision, execution
    and intent. L4 = closed-loop, intent-driven operations where the system owns awareness-to-execution and intent is shared
    human-machine; L5 = the system sets its own intents across all scenarios.'
  source: TM Forum Autonomous Networks framework (IG1251/IG1253 intent-driven operation; AN Level 4 blueprint 2025)
- concept: Digital twins & simulation (incl. DTO)
  definition: A dynamic software model relying on operational and contextual data to understand how an organization operationalizes
    its business model, respond to changes, deploy resources, simulate future states and deliver customer value; used to
    prioritize, guide, plan, monitor, simulate, analyze and scale complex initiatives; process mining is the typical on-ramp.
  source: Gartner (Digital Twin of an Organization definition; Market Guide/MQ for DTO platforms)
- concept: Human-agent teaming (HMT/HAIT)
  definition: One or more people and one or more AI systems collaborating and coordinating to achieve task completion; teammates
    interact, adapt to the dynamic task and achieve common goals. Requires trust calibration, shared mental models, delegation
    protocols, adaptive autonomy, and human oversight (human-in/on-the-loop); even at maximum autonomy AI augments human
    agency under human oversight.
  source: See et al. (2007); Demir et al. (2021); arXiv 2503.16518 / 2504.05755 (HMT/HAIT reviews 2025)
- concept: Network APIs / Open Gateway / CAMARA
  definition: Standardized, federated operator network APIs exposing capabilities (number verification, SIM swap, device
    location/status, quality-on-demand, edge discovery, carrier billing) so developers can build once and deploy across
    operators; foundation for NaaS, slicing, and telecom platform monetization.
  source: GSMA Open Gateway / CAMARA project (2025-2026 state of the market)
- concept: AI TRiSM
  definition: 'AI trust, risk and security management: technical capabilities ensuring AI systems are trustworthy, secure
    and compliant through continuous monitoring, validation and runtime enforcement - model inventory and risk scoring,
    explainability, bias/fairness, guardrails, guardian agents, EU AI Act readiness.'
  source: Gartner AI TRiSM framework and Market Guide for AI TRiSM (2025-2026)
- concept: Evidence-based assessment
  definition: 'Assessments must be objective, consistent, repeatable and representative; repeatable means a second assessor
    reaches the same rating from the same artifacts. Maturity levels are cumulative: each level builds on the previous by
    adding functionality or rigor.'
  source: ISO/IEC 33002:2015; CMMI v3 staged representation; EDM DCAM (objectives, questions, artifacts of evidence, scoring
    criteria)
