# Digital Transformation Operationalized Maturity & Assessment Model
# New model lodged via proposal 0002 (see proposals/0002-digital-transformation-operationalized.md).
# CI contract: id/name/domain/version + exactly 5 levels, each with id/name/score_range/summary/characteristics/exit_criteria/evidence.

id: dea:maturity-digital-transformation-operationalized
name: Digital Transformation Operationalized Maturity & Assessment Model
domain: digital-transformation
version: 1.0.0-alpha
metamodel_version: ^0.1.0
owner: Digital Transformation Office / Enterprise Architecture Lead
description: 'Digital-business maturity and assessment model. Positions digital transformation as the reimagining of the
  organization''s business and operating model as a digital business: grounded in advanced digital technology adoption (AI,
  agentic AI, autonomous systems, composable cloud-native platforms, digital twins), expressed through novel operating models
  across all operating concerns, steered by customer- and ecosystem-centric digital strategy, and run as a deliberate working
  model between humans and software agents. Technology is an enabler, not the subject. Every criterion is MECE-placed, carries
  five evidence-anchored progression levels correlated to the org''s canonical L-0..L-4 scale, and is independently assessable.'
lineage: 'Derived from TM Forum Digital Maturity Model v5.0.2 (GB997A) via a full structural and gap review (see proposals/0002-digital-transformation-operationalized.md):
  6 dimensions / 31 sub-dimensions / 129 criteria re-harvested into a MECE digital-business model of 6 dimensions / 24 sub-dimensions
  / 72 criteria, with evidence-anchored 5-level progression, transversal levers for current industry concepts (agentic AI,
  autonomy ladder, digital twins/DTO, human-agent teaming, network APIs), and an explicit scoring/advancement mechanism.'
levels:
- id: level-1-unrealized
  name: Unrealized
  v2_name: Emergent
  legacy_id: level-1-ad-hoc
  legacy_name: Ad Hoc
  canonical:
    scale_level: L-0
    ordinal: 0
    canonical_name: Absent
    v2_band: dea:maturity-band-emergent
    v2_score_range: &id002
    - 0
    - 20
    effort_multiplier: 1.0
  score_range: &id001
  - 0
  - 25
  summary: 'Value unrealized: digital activity is informal and person-dependent; transformation value is at risk'
  definition: No coherent digital-business ambition yet. Initiatives are ad hoc pilots driven by individuals; no shared
    strategy, vocabulary, or governance for AI, data, or platforms.
  characteristics:
  - Digital initiatives are ad hoc pilots driven by individuals; no shared strategy or vocabulary
  - Technology and process choices are reactive; no reference architecture or standards
  - No measurable digital KPIs; customer journeys fragmented across channels
  - AI used informally (e.g., personal copilots) with no governance, inventory, or oversight
  - Data trapped in silos; no governance, quality, or sharing practices
  unlocks:
  - Executive attention and a signed digital strategy with named sponsor
  - First governed pilots with documented results
  - Baseline inventory of systems, AI use cases, and critical data
  exit_criteria:
  - Digital strategy document with executive sponsor approved
  - Inventory of digital initiatives, systems, and AI use cases exists
  - At least one governed pilot with documented results and lessons
  evidence:
  - No strategy/charter; initiatives tracked in personal spreadsheets
  - No architecture review board; decisions in chat threads
  - No AI inventory or data catalog
- id: level-2-proven
  name: Proven
  v2_name: Structured
  legacy_id: level-2-defined
  legacy_name: Defined
  canonical:
    scale_level: L-1
    ordinal: 1
    canonical_name: Piloting
    v2_band: dea:maturity-band-structured
    v2_score_range: &id004
    - 21
    - 45
    effort_multiplier: 1.5
  score_range: &id003
  - 26
  - 50
  summary: 'Value proven in governed pilots: strategy and playbooks documented, adoption still uneven'
  definition: The organization has a documented digital strategy, target operating model, and playbooks, but enforcement
    is inconsistent and value is not yet systematically measured.
  characteristics:
  - Documented digital strategy, target operating model, and reference architecture
  - Standard playbooks (CI/CD, security, data) exist but adoption is partial
  - Customer journeys mapped; some channels integrated; CX metrics collected manually
  - AI use cases inventoried; pilots in selected functions with basic guardrails
  - Data governance framework defined; central catalog started
  unlocks:
  - Repeatable delivery in key domains; golden paths available to teams
  - CX metrics trusted enough to steer; AI pilots governed; data catalog live
  - First ecosystem/API products with paying partners
  exit_criteria:
  - Playbooks enforced via tooling (golden paths) in key domains
  - CX metrics tracked systematically across all channels
  - AI governance policy approved; agents confined to supervised sandboxes
  - Data quality SLAs defined for critical data products
  evidence:
  - Strategy doc signed off; architecture decision records (ADRs) in use
  - CI/CD pipelines for most teams; security scans in pipeline for key apps
  - Data catalog live with owners assigned for critical data
- id: level-3-standardized
  name: Standardized
  v2_name: Systematic
  legacy_id: level-3-managed
  legacy_name: Managed
  canonical:
    scale_level: L-2
    ordinal: 2
    canonical_name: Defined
    v2_band: dea:maturity-band-systematic
    v2_score_range: &id006
    - 46
    - 70
    effort_multiplier: 2.5
  score_range: &id005
  - 51
  - 75
  summary: 'Value standardized: digital practice is governed and tooling-enforced org-wide, so value is repeatable'
  definition: 'Digital-business capabilities are the default way of working: standards are enforced by CI/conformance tooling,
    journeys are real-time and orchestrated, and AI agents operate in supervised workflows with AI TRiSM controls.'
  characteristics:
  - Strategy, architecture, and platform standards enforced via CI/conformance tooling
  - Composable, API-first platforms are the default for new services; legacy de-layering underway
  - Omni-channel journeys orchestrated in real time; personalization data-driven
  - Ecosystem/partner onboarding via self-service portals; API products monetized
  - Agentic AI deployed in defined, supervised workflows (human-in-the-loop); AI TRiSM controls active
  - Autonomous operations (AN L3) in key domains; digital twins used for assurance
  - Data products with contracts, quality SLAs, and lineage; self-service analytics widely adopted
  unlocks:
  - Conformance CI blocks non-standard change; teams ship faster safely
  - Customers experience one coherent, real-time brand across channels and partners
  - Agents handle defined workflows end to end under supervision; humans focus on exceptions
  - Operations in key domains run closed-loop (AN L3); twins inform assurance and planning
  - Regulatory posture (DORA/NIS2/EU AI Act) automated and evidenced
  exit_criteria:
  - 'Metrics-driven management: SLOs/error budgets, flow metrics, unit economics tracked per domain'
  - Autonomy at AN L4 in at least one domain (closed-loop, intent-driven)
  - Digital twin of operations used for what-if planning
  - AI agents act with defined agency levels under continuous monitoring and kill-switch oversight
  - Regulatory compliance (DORA/NIS2/EU AI Act) automated and evidenced
  evidence:
  - Conformance CI blocks non-standard changes; golden-path templates mandatory
  - SLO dashboards per service; error budgets gate releases
  - AI inventory with risk scores; runtime guardrails and audit logs
  - DTO/process-mining pipeline live for top value streams
- id: level-4-compounding
  name: Compounding
  v2_name: Adaptive
  legacy_id: level-4-quantitatively-managed
  legacy_name: Quantitatively Managed
  canonical:
    scale_level: L-3
    ordinal: 3
    canonical_name: Scaled
    v2_band: dea:maturity-band-adaptive
    v2_score_range: &id008
    - 71
    - 88
    effort_multiplier: 4.0
  score_range: &id007
  - 76
  - 90
  summary: 'Value compounding: the digital business is metrics-driven, predictive and self-adapting, so value scales'
  definition: 'The organization senses and responds: predictive closed-loop operations across domains (AN L4+), customer
    and ecosystem outcomes optimized in real time, twins/simulation drive decisions, and agents act with graded autonomy
    under human-on-the-loop oversight.'
  characteristics:
  - 'Predictive, closed-loop operations across domains (AN L4+): system owns awareness, analysis, decision, execution; intent
    shared human-machine'
  - Customer and ecosystem outcomes predicted and optimized in real time (churn, CLTV, partner value)
  - Digital twins/simulation drive planning, what-if, and agent rehearsal sandboxes
  - AI agents operate with graded autonomy per use-case risk; human-on-the-loop; continuous TRiSM monitoring
  - Value streams and flow metrics (DORA) drive portfolio allocation; FinOps/GreenOps cost and carbon per workload
  - Resilience tested (chaos, TLPT); third-party risk and exit strategies managed quantitatively
  unlocks:
  - Release and capacity decisions driven by SLOs/error budgets and flow metrics, not meetings
  - Major strategy and operating-model changes simulated in the DTO before a dollar is committed
  - Network capabilities monetized as programmable products (Open Gateway/CAMARA-class APIs, NaaS)
  - Agents act autonomously in bounded, high-trust scopes; humans on the loop, not in it
  - Risk, cost, and carbon per workload visible and quantitatively managed
  exit_criteria:
  - 'Full autonomy (AN L5) demonstrated in selected scenarios: system sets its own intents within policy'
  - DTO used to simulate strategy and operating-model changes before execution
  - Regulatory and AI-risk posture continuously evidenced (audit-ready)
  - 'Self-improving platforms: telemetry feeds back into standards and golden paths'
  evidence:
  - MTTD/MTTR, change failure rate, deployment frequency tracked and improving
  - Predictive alerts >50% of sev-1; auto-remediation >30% of incidents
  - Agent actions logged, explainable, and reversible; kill-switch tested
  - Cost and carbon per workload tracked weekly
- id: level-5-leading
  name: Leading
  v2_name: Self-Optimising
  legacy_id: level-5-optimising
  legacy_name: Optimising
  canonical:
    scale_level: L-4
    ordinal: 4
    canonical_name: Self-Optimising
    v2_band: dea:maturity-band-self-optimising
    v2_score_range: &id010
    - 89
    - 100
    effort_multiplier: 6.0
  score_range: &id009
  - 91
  - 100
  summary: 'Value leading: the digital business is self-optimizing and intent-driven end to end, setting benchmarks'
  definition: Humans set outcomes, intent, and policy; agents and closed loops execute. Telemetry, twins, and benchmarks
    continuously feed strategy, architecture, and roadmaps. The organization is an active ecosystem citizen (standards,
    open source, benchmarks, mentoring).
  characteristics:
  - 'Intent-driven, autonomous operating model across domains: humans set outcomes and policy; agents and closed loops execute'
  - 'Continuous self-optimization: telemetry, twins, and benchmarks feed strategy, architecture, and roadmaps automatically'
  - Network/edge capabilities exposed as programmable products (Open Gateway/CAMARA-class APIs, NaaS) at scale
  - 'Human-agent teaming is a designed operating model: roles, trust, oversight, and accountability engineered'
  - Organization benchmarks, mentors peers, and contributes back to standards, open source, and the assessment ecosystem
  unlocks:
  - Board-level digital KPIs tied to customer and ecosystem outcomes; transformation is simply how the org works
  - 'Industry recognition: benchmarks locked, standards authored, peers mentored'
  - 'Marginal gains compound: every level-4 investment pays for the next'
  exit_criteria:
  - None - continuous improvement is the practice
  evidence:
  - Locked benchmark baselines; published contributions to standards/open source
  - Board-level digital KPIs tied to customer and ecosystem outcomes
  - Post-incident and experiment learnings automatically update playbooks
level_correlation:
  note: 'This model''s five levels correlate 1:1 with the org''s canonical L-0..L-4 scale (dea:scale-digital-transformation-v1
    in maturity-model-digital-transformation; CR-AM-09 v2 bands): model level N maps to canonical ordinal N-1 (L-0..L-4).
    Primary names use the v2 state-names (Emergent/Structured/Systematic/Adaptive/Self-Optimising, kept as v2_name aliases,
    proposal 0001); primary names denote the value state (Unrealized/Proven/Standardized/Compounding/Leading); legacy_id/legacy_name
    keep v1-alpha catalog names resolvable; score_range keeps the uniform catalog v1-alpha bands; canonical.v2_score_range
    + effort_multiplier carry the non-linear v2 bands (0-20/21-45/46-70/71-88/89-100, multipliers 1.0/1.5/2.5/4.0/6.0) as
    the correlation to the canonical scale. Known semantic offset: catalog v1 level-1 ''Ad Hoc'' spans canonical L-0+L-1;
    this model splits that bottom range via Emergent(L-0) and Structured(L-1). Progression semantics match the canonical
    scale: linear topology, exponential effort, forward-only with no skipping, exit-criteria + evidence gates, highest-conformant-level
    resolution.'
  mapping:
  - model_level: level-1-unrealized
    model_name: Unrealized
    value_name: Unrealized
    state_name: Emergent
    score_range: *id001
    legacy_id: level-1-ad-hoc
    legacy_name: Ad Hoc
    canonical_scale_level: L-0
    canonical_ordinal: 0
    canonical_name: Absent
    v2_band: dea:maturity-band-emergent
    v2_score_range: *id002
    effort_multiplier: 1.0
  - model_level: level-2-proven
    model_name: Proven
    value_name: Proven
    state_name: Structured
    score_range: *id003
    legacy_id: level-2-defined
    legacy_name: Defined
    canonical_scale_level: L-1
    canonical_ordinal: 1
    canonical_name: Piloting
    v2_band: dea:maturity-band-structured
    v2_score_range: *id004
    effort_multiplier: 1.5
  - model_level: level-3-standardized
    model_name: Standardized
    value_name: Standardized
    state_name: Systematic
    score_range: *id005
    legacy_id: level-3-managed
    legacy_name: Managed
    canonical_scale_level: L-2
    canonical_ordinal: 2
    canonical_name: Defined
    v2_band: dea:maturity-band-systematic
    v2_score_range: *id006
    effort_multiplier: 2.5
  - model_level: level-4-compounding
    model_name: Compounding
    value_name: Compounding
    state_name: Adaptive
    score_range: *id007
    legacy_id: level-4-quantitatively-managed
    legacy_name: Quantitatively Managed
    canonical_scale_level: L-3
    canonical_ordinal: 3
    canonical_name: Scaled
    v2_band: dea:maturity-band-adaptive
    v2_score_range: *id008
    effort_multiplier: 4.0
  - model_level: level-5-leading
    model_name: Leading
    value_name: Leading
    state_name: Self-Optimising
    score_range: *id009
    legacy_id: level-5-optimising
    legacy_name: Optimising
    canonical_scale_level: L-4
    canonical_ordinal: 4
    canonical_name: Self-Optimising
    v2_band: dea:maturity-band-self-optimising
    v2_score_range: *id010
    effort_multiplier: 6.0
scoring:
  mechanism: weighted-mean-0-100
  description: Each criterion is scored 1-5 against its level anchors by an assessor using the listed evidence. Criterion
    score (0-100) = (level - 1) / 4 * 100. Sub-dimension score = mean of its criteria; dimension score = weighted mean of
    its sub-dimensions (equal weights within a dimension); overall score = weighted mean of dimension scores using the declared
    dimension weights (d1 0.20, d2 0.20, d3 0.20, d4 0.15, d5 0.10, d6 0.15). The overall score is banded into the five
    catalog bands (0-25 / 26-50 / 51-75 / 76-90 / 91-100) to resolve the model level.
  criterion_scale:
    min: 1
    max: 5
    meaning: level anchor matched by evidence
  aggregation: weighted-mean
  band_resolution: catalog v1-alpha bands; level = band of overall score, capped by weakest-link rule below
  dimension_weights:
    d1: 0.2
    d2: 0.2
    d3: 0.2
    d4: 0.15
    d5: 0.1
    d6: 0.15
  lite_path: 'Rapid self-assessment: one 5-point Likert question per sub-dimension (lite_question), mapped (1..5) to criterion
    levels for an indicative score; full assessment requires evidence per criterion.'
advancement:
  progression_semantics: linear topology, exponential effort, forward-only (no level skipping), exit-criteria + evidence
    gates, highest-conformant-level resolution - identical to the canonical L-0..L-4 scale (see level_correlation)
  rules:
  - 'Cumulative ladder: claiming level L on any criterion requires evidence for all anchors below L (no skipping).'
  - 'Weakest-link gate: a dimension''s resolved level cannot exceed its lowest mandatory criterion level; the overall level
    cannot exceed the lowest dimension level among d1-d4 (customer, strategy, platforms, operations).'
  - Exit criteria per model level (levels[].exit_criteria) must be met AND evidenced to advance the model level.
  - 'Highest-conformant-level resolution: if any mandatory criterion is below the band of the overall score, the model resolves
    to the highest level at which all mandatory criteria conform.'
  headroom_metric: delta_to_next_level = distance in points to the next band boundary, reported per dimension to prioritize
    investment.
  effort_multiplier_advisory:
    note: 'Aligned with proposals/0001-nonlinear-maturity-scoring.md (v2 bands, advisory until CR-AM-01 Release 1): effort
      multipliers 1.0/1.5/2.5/4.0/6.0 make diminishing returns explicit; effort-adjusted value = sum of points earned per
      band divided by its multiplier.'
    by_level:
      '1': 1.0
      '2': 1.5
      '3': 2.5
      '4': 4.0
      '5': 6.0
transversal_levers:
- id: agentic-ai
  name: Agentic AI & Agents
  description: Autonomous/semi-autonomous software entities that perceive, decide, act and achieve goals with minimal human
    supervision; multi-agent systems orchestrated toward strategic objectives. Agency is graded (levels of agency) and governed
    (Gartner Top Strategic Technology Trends 2025).
- id: autonomy
  name: Autonomy Ladder
  description: 'TM Forum Autonomous Networks L0-L5: per domain, who owns awareness, analysis, decision, execution, and intent.
    L4 = system owns awareness-to-execution with intent shared; L5 = system sets its own intents.'
- id: digital-twins
  name: Digital Twins & Simulation
  description: Dynamic software models on operational/contextual data that understand, simulate and respond - from network/service
    twins to the Digital Twin of an Organization (DTO) used to prioritize, plan, monitor, simulate and scale initiatives
    (Gartner).
- id: human-agent-teaming
  name: Human-Agent Teaming
  description: People and AI agents collaborating/coordinating toward shared goals as teammates, with trust calibration,
    delegation protocols, adaptive autonomy, and human oversight (human-in/on-the-loop) (HMT/HAIT literature).
- id: ecosystem-platforms
  name: Ecosystems, Platforms & Network APIs
  description: Platform and ecosystem business models incl. GSMA Open Gateway / CAMARA network APIs (number verification,
    SIM swap, location, quality-on-demand, edge discovery, carrier billing), NaaS, slicing, B2B2X marketplaces.
- id: trust-security-privacy
  name: Security, Privacy, Trust & AI TRiSM
  description: 'Zero trust, supply-chain security, privacy/PETs, sovereignty, and AI TRiSM (AI trust, risk and security
    management): continuous monitoring, explainability, bias/fairness, guardrails, guardian agents, EU AI Act readiness
    (Gartner).'
- id: sustainability-esg
  name: Sustainability & ESG
  description: ESG strategy and reporting (CSRD/double materiality), carbon accounting (Scopes 1-3), GreenOps, circular
    IT and e-waste.
- id: composability
  name: Composability & Open APIs
  description: Composable, API-first, event-driven architecture aligned to open standards (e.g., TM Forum ODA) with governed
    API catalogs and golden paths.
- id: business-value
  name: Business Value & Monetization
  description: 'Customer/ecosystem-centric value: digital business models, pricing and charging, revenue assurance, unit
    economics, measurable outcomes.'
- id: innovation
  name: Innovation & Experimentation
  description: Experimentation culture, safe-to-fail, flow metrics, venturing, open-source and standards participation.
- id: grc
  name: Governance, Risk & Compliance
  description: ERM, internal audit, regtech, DORA/NIS2 resilience testing, third-party/vendor risk, concentration and exit.
- id: data-intelligence
  name: Data & Decision Intelligence
  description: Data products, quality, lineage, governance, sharing, AI data readiness, twins data, insights-to-action loops.
dimensions:
- id: d1
  name: Customer & Ecosystem Value
  weight: 0.2
  description: How the digital business understands, serves, and grows with customers and the ecosystems it cultivates -
    journeys, personalization, partnerships, and monetization.
  sub_dimensions:
  - id: d1s1
    name: Customer Experience & Journey Orchestration
    lite_question: We orchestrate seamless, real-time, personalized customer journeys across all channels.
    criteria:
    - id: d1c1
      name: Omni-channel journey orchestration
      statement: Customer journeys are orchestrated seamlessly across all digital and physical channels with unified context.
      levers:
      - business-value
      anchors:
      - level: 1
        text: Channels fragmented; inconsistent experience; no shared customer view
      - level: 2
        text: Key channels (web/mobile) integrated; partial data synchronization
      - level: 3
        text: Unified omni-channel platform with real-time event-driven data flow
      - level: 4
        text: Journey orchestration engine drives context-aware interactions across channels
      - level: 5
        text: Predictive, intent-aware journeys anticipate needs across channels and partners
      evidence:
      - Channel inventory; CX journey maps
      - CDP/journey analytics dashboards
      - Real-time event bus; orchestration playbooks
      - Journey orchestration platform metrics (conversion, drop-off)
      - Predictive journey models with measured uplift
    - id: d1c2
      name: Real-time personalization & next-best-action
      statement: Personalization and next-best-action are driven by real-time customer data (CDP/martech) on every touchpoint.
      levers:
      - business-value
      - data-intelligence
      anchors:
      - level: 1
        text: No personalization; generic content and offers
      - level: 2
        text: Rule-based personalization on web only
      - level: 3
        text: Segment-based personalization across main digital channels
      - level: 4
        text: AI-driven next-best-action with real-time CDP on all touchpoints
      - level: 5
        text: Autonomous, context-aware personalization optimizing CLTV in real time
      evidence:
      - Martech stack inventory
      - Personalization rules catalog
      - CDP unified profile coverage %
      - NBA engine logs and A/B results
      - CLTV/CSAT uplift attributed to personalization
    - id: d1c3
      name: Voice of customer & CX measurement
      statement: Customer feedback (NPS/CSAT/journey analytics/VoC) is captured continuously and closes the loop into product
        and operations.
      levers:
      - business-value
      anchors:
      - level: 1
        text: Feedback ad hoc; complaints handled reactively
      - level: 2
        text: Periodic surveys; no closed loop
      - level: 3
        text: Continuous NPS/CSAT plus journey analytics on key journeys
      - level: 4
        text: VoC program with analytics driving roadmap and ops fixes
      - level: 5
        text: 'Predictive CX management: issues prevented before customers report them'
      evidence:
      - Survey tooling
      - NPS/CSAT dashboards
      - Journey analytics; feedback-to-action tracker
      - VoC governance board minutes
      - Churn reduction correlated with VoC actions
  - id: d1s2
    name: Ecosystem & Partner Orchestration
    lite_question: We orchestrate trusted partners and marketplaces through self-service platforms.
    criteria:
    - id: d1c4
      name: Partner lifecycle & marketplace operations
      statement: Partners are onboarded, managed, and settled through governed, self-service platform/marketplace operations.
      levers:
      - ecosystem-platforms
      anchors:
      - level: 1
        text: Partnerships ad hoc, bilateral, manual contracts
      - level: 2
        text: Basic partner portal; onboarding still manual
      - level: 3
        text: Self-service onboarding, standard agreements, governed marketplace
      - level: 4
        text: Partner performance and value metrics actively managed; co-creation programs
      - level: 5
        text: 'Autonomous partner ecosystem: AI-matched partners, dynamic revenue share, self-settling'
      evidence:
      - Partner contracts; onboarding checklist
      - Partner portal analytics
      - Marketplace GMV/partner NPS
      - API adoption and partner value dashboards
      - Settlement automation logs; partner SLAs
    - id: d1c5
      name: B2B2X value networks
      statement: The organization builds and orchestrates B2B2X value networks, sharing risk, control, and revenue with
        partners.
      levers:
      - ecosystem-platforms
      - business-value
      anchors:
      - level: 1
        text: No B2B2X activity; pure direct model
      - level: 2
        text: Occasional white-label deals, no shared platform
      - level: 3
        text: Structured B2B2X partnerships on a shared platform
      - level: 4
        text: Multi-partner value networks with shared catalogs and joint go-to-market
      - level: 5
        text: 'Ecosystem-led growth: network effects, co-innovation, shared outcomes as the default model'
      evidence:
      - Partner revenue share of total
      - White-label/OTT case list
      - Joint GTM plans
      - Value-network architecture diagrams
      - Ecosystem revenue and retention metrics
    - id: d1c6
      name: API products, developer ecosystem & network APIs
      statement: 'APIs are managed as products for internal and external developers, including telecom network capabilities
        (GSMA Open Gateway/CAMARA: number verification, SIM swap, location, quality-on-demand, edge discovery, carrier billing;
        NaaS/slicing).'
      levers:
      - ecosystem-platforms
      - composability
      anchors:
      - level: 1
        text: APIs ad hoc, internal only, undocumented
      - level: 2
        text: Some documented APIs; no developer portal or monetization
      - level: 3
        text: API catalog/portal, standard contracts, basic analytics; network APIs piloted
      - level: 4
        text: API products monetized via marketplace/aggregators; QoD, location, anti-fraud APIs in production
      - level: 5
        text: 'Programmable network/platform at scale: NaaS, slicing, edge - federated across operators; developer ecosystem
          self-sustaining'
      evidence:
      - API inventory
      - Developer portal; API analytics
      - Open API conformance (e.g., TMF Open APIs)
      - Network API transaction volumes and revenue
      - Open Gateway/CAMARA certification; federation agreements
  - id: d1s3
    name: Digital Products, Monetization & Growth
    lite_question: We monetize digital products and network capabilities with modern pricing and growth practices.
    criteria:
    - id: d1c7
      name: Composable digital product portfolio
      statement: Digital products/services are composable, modular, and rapidly assembled from reusable components (composable
        commerce/headless where relevant).
      levers:
      - business-value
      - composability
      anchors:
      - level: 1
        text: Monolithic product stack; slow releases
      - level: 2
        text: Some modular services; releases still coordinated manually
      - level: 3
        text: Composable product architecture with reusable components and catalog
      - level: 4
        text: Product teams assemble offerings via APIs/marketplace components; fast TTM
      - level: 5
        text: 'Self-assembling offerings: customers/partners compose solutions dynamically; continuous TTM under weeks'
      evidence:
      - Service/component catalog
      - Release train records
      - Component reuse metrics
      - TTM dashboards
      - Composable storefront/marketplace metrics
